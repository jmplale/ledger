<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <p class="eyebrow">Ledger</p>
      <h1 id="authTitle">Welcome back</h1>
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-mode="login">Log in</button>
        <button type="button" class="auth-tab" data-mode="signup">Sign up</button>
      </div>
      <form id="authForm" autocomplete="on">
        <label for="username">Username</label>
        <input type="text" id="username" required minlength="3" maxlength="30" autocomplete="username">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" autocomplete="current-password">
        <p class="auth-error" id="authError"></p>
        <button type="submit" class="auth-submit" id="authSubmit">Log in</button>
      </form>
    </div>
  </div>
<script src="auth.js"></script>
</body>
</html>
